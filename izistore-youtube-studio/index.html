<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06100c">
<title>IZI Store — Studio YouTube</title>
<style>
html,body{height:100%;margin:0;background:#06100c;color:#f3fff8;font-family:Inter,system-ui,sans-serif}
.wrap{height:100%;display:grid;place-items:center;padding:24px;text-align:center}
.logo{width:54px;height:54px;border-radius:16px;background:#32e882;color:#031009;display:grid;place-items:center;font-weight:1000;margin:0 auto 18px;box-shadow:0 0 38px rgba(50,232,130,.25)}
h1{font-size:30px;letter-spacing:-.04em;margin:0 0 8px}p{color:#9db7a8;margin:0}.bar{width:min(360px,80vw);height:7px;background:rgba(255,255,255,.1);border-radius:999px;margin:22px auto 0;overflow:hidden}.bar i{display:block;height:100%;width:35%;background:#32e882;border-radius:999px;animation:load 1.1s infinite ease-in-out}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(380%)}}.error{color:#ffd273;max-width:620px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap" id="loading"><div><div class="logo">IZI</div><h1>Studio YouTube</h1><p>Chargement des 24 scripts…</p><div class="bar"><i></i></div></div></div>
<script>
(async()=>{
  try{
    if(!("DecompressionStream" in window)) throw new Error("Ce navigateur ne prend pas en charge la décompression intégrée. Ouvrez la page avec une version récente de Chrome, Edge, Firefox ou Safari.");
    const files=["payload-01.txt", "payload-02.txt", "payload-03.txt", "payload-04.txt", "payload-05.txt", "payload-06.txt"];
    const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:"no-store"});if(!r.ok)throw new Error("Fichier manquant : "+f);return (await r.text()).trim();}));
    const binary=atob(parts.join(""));
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const page=await new Response(stream).text();
    document.open();document.write(page);document.close();
  }catch(err){
    console.error(err);
    document.getElementById("loading").innerHTML='<div><div class="logo">IZI</div><h1>Chargement impossible</h1><p class="error">'+String(err.message||err)+'</p></div>';
  }
})();
</script>
</body>
</html>
